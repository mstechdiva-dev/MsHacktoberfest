<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Wash: a cozy laundry game, once a day</title>
<meta name="description" content="Sort it, wash it, fold it into the basket. A cozy browser laundry game you play once a day.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<a class="skip" href="#app">Skip to the game</a>
<header class="site-header">
  <a id="brand" class="brand" href="./">cozy<span>wash</span></a>
  <nav id="steps" class="steps" aria-label="Steps" hidden></nav>
  <div class="header-right">
    <span id="status-pill" class="pill" role="status" aria-live="polite" data-dot="accent"><span class="dot" aria-hidden="true"></span><span class="pill-text">Practice</span></span>
    <button id="sound-btn" class="icon-btn sound-btn" type="button" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
      <span class="sound-text">Tap to turn sound on</span>
    </button>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="#ffffff"/><circle cx="15" cy="17" r="2.5" fill="#ffffff"/></svg>
    </button>
  </div>
</header>

<main id="app" class="app" tabindex="-1">
  <div class="screen center"><p>Opening Cozy Wash…</p></div>
</main>

<footer class="site-footer">
  <span>Cozy Wash · a cozy laundry game, one basket a day</span>
  <span id="practice-note" hidden>Practice mode: no live notes.</span>
  <a href="https://github.com/MSHacktoberfest/cozywash">Open source on GitHub</a>
</footer>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<dialog id="settings" class="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label class="row"><input type="checkbox" name="sound"> Sound</label>
    <label class="row col">Volume <input type="range" name="volume" min="0" max="1" step="0.05"></label>
    <label class="row"><input type="checkbox" name="captions"> Show sound captions</label>
    <label class="row"><input type="checkbox" name="roomTone"> Quiet laundromat background</label>
    <label class="row"><input type="checkbox" name="reducedMotion"> Reduce motion</label>
    <button type="button" class="btn" data-close>Done</button>
  </form>
</dialog>

<script type="module" src="src/main.js"></script>
</body>
</html>
